<!DOCTYPE html>
<html>
<head>
    <title>bobber | {{.Title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/static/assets/styles.css">
    <script src="/static/assets/script.js"></script>
</head>
<body>
<header>
    <div class="header-content responsive-wrapper">
        <a href="#" id="logo">
            <h1>bobber</h1>
        </a>
        <div id="header-navigation">
            <nav class="flex">
                <a href="#"> Requests </a>
                <a href="#"> Namespaces </a>
                <a href="#"> Endpoints </a>
            </nav>
            <nav class="flex">
                <a href="#" class="button"><span class="material-icons">settings</span></a>
                <a href="#" class="button"><span class="material-icons">login</span></a>
            </nav>
        </div>
    </div>
</header>

<main>
    {{template "content" .}}
</main>

<footer>
    <p>Made by <a href="https://tylerdimon.com">Tyler Dimon</a></p>
</footer>
</body>
</html>
<script>
    var ws = new WebSocket("ws://localhost:8000/ws");

    ws.onmessage = function(event) {
        addRequestToList(event.data);
    };

    ws.onopen = function(event) {
        ws.send("Connected");
    };
</script>
